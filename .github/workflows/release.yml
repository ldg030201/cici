name: 릴리스

# v0.1.0 같은 태그를 밀면 확장을 묶어서 웹스토어에 올리고 게시한다.
# 수동 실행(workflow_dispatch)으로 "업로드만" 하고 대시보드에서 눈으로 확인한 뒤
# 게시하는 것도 가능하다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '게시까지 할지 (끄면 초안으로만 올린다)'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 깨진 버전을 스토어에 올리지 않는다. 심사는 며칠 걸리므로
      # 되돌리는 비용이 크다.
      - name: 테스트
        run: npm test

      # 태그(v0.1.0)와 manifest.json 의 version(0.1.0)이 어긋나면
      # 스토어에 올라간 버전과 저장소 태그가 영영 안 맞는다.
      - name: 태그와 manifest 버전 대조
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./extension/manifest.json').version")
          echo "태그=$TAG  manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::태그 v$TAG 와 manifest.json 의 $MANIFEST 가 다릅니다"
            exit 1
          fi

      # extension/lib 은 src 에서 복사된 것이다. 커밋을 깜빡했으면
      # 스토어에 옛 파서가 올라간다. --check 는 쓰지 않고 확인만 한다.
      - name: 확장 lib 동기화 확인
        run: npm run check:ext

      - name: zip 만들기
        run: npm run pack:ext

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip

      - name: 웹스토어에 올리기
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            node scripts/publish-extension.mjs --skip-publish
          else
            node scripts/publish-extension.mjs
          fi

      - name: GitHub 릴리스 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
